# Nome do Workflow
name: CI/CD - Build e Deploy do MS de Telemetria

# Gatilhos
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-and-trigger-deploy:
    # Nome do Job
    name: Build e Acionamento do Deploy de Telemetria
    # Use as mesmas etiquetas do seu runner
    runs-on: [self-hosted, karol]

    steps:
      # 1. Checkout do código
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configurar Java (JDK 21)
      - name: Configurar Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Dar permissão de execução ao Maven Wrapper
      - name: Dar permissão de execução ao Maven Wrapper
        run: chmod +x ./mvnw

      # 4. Executar Build com Maven (pulando os testes, como no seu Dockerfile)
      - name: Executar Build com Maven
        run: ./mvnw clean package -DskipTests

      # 5. Acionar o Deploy do MS de Telemetria no Jenkins
      # Este passo só roda se o build anterior tiver sucesso
      - name: Acionar Deploy no Jenkins (Homologação)
        if: success()
        run: |
          # A única mudança é o nome do job na URL: /job/harpia-ms-telemetria/
          curl -X POST "${{ secrets.JENKINS_URL }}/job/harpia-ms-telemetria/buildWithParameters?token=${{ secrets.JENKINS_BUILD_TOKEN }}" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            --data-urlencode "BRANCH_VERSION=develop" \
            --data-urlencode "CLIENT_NAME=harpia-homologacao" \
            --fail

      # 6. Notificação de SUCESSO no Discord
      - name: ✔️ Notificar Sucesso e Trigger de Deploy
        if: success()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'success'
          title: "MS Telemetria: Build OK, Deploy Acionado!"
          description: "O build na branch `develop` foi concluído. O deploy para **homologação** foi acionado no Jenkins."
          color: 0x00FF00 # Verde

      # 7. Notificação de FALHA no Discord
      - name: ❌ Notificar Falha no Build
        if: failure()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK_URL }}
          status: 'failure'
          title: "Falha no Build do MS de Telemetria!"
          description: "Ocorreu um erro durante o build na branch `develop` e o deploy não foi acionado. Verifique os logs."
          color: 0xFF0000 # Vermelho
